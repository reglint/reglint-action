name: "RegLint"
description: "Run RegLint regex scans with YAML-defined rules, SARIF output, and CI-friendly exit codes."
author: "iyaki"
branding:
  icon: "search"
  color: "blue"

inputs:
  tool-version:
    description: "RegLint version to install (e.g. v0.1.0). Defaults to the latest release."
    required: false
    default: "latest"
  config:
    description: "Path to the YAML rules config file."
    required: false
    default: "reglint-rules.yaml"
  paths:
    description: "Paths to scan (space-separated)."
    required: false
    default: "."
  fail-on:
    description: "Fail if matches at or above severity (error or warning)."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Resolve tool version
      id: tool
      shell: bash
      run: |
        v="${{ inputs.tool-version }}"
        if [ -z "$v" ] || [ "$v" = "latest" ]; then
          v=$(basename "$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/reglint/reglint/releases/latest)")
        fi
        v="v${v#v}"
        echo "tag=$v" >> "$GITHUB_OUTPUT"

    - name: Install RegLint
      shell: bash
      env:
        REGLINT_VERSION: ${{ steps.tool.outputs.tag }}
      run: |
        curl -fsSL "https://raw.githubusercontent.com/reglint/reglint/${{ steps.tool.outputs.tag }}/install.sh" | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Run RegLint
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        FAIL_ON: ${{ inputs.fail-on }}
        PATHS: ${{ inputs.paths }}
      run: |
        args=""
        if [ -n "$FAIL_ON" ]; then
          args="$args --fail-on $FAIL_ON"
        fi
        # $args and $PATHS are intentionally word-split.
        reglint analyze --config "$CONFIG" --format github $args $PATHS
